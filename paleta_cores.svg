<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#020307" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0E17" />
      <stop offset="100%" stop-color="#07080D" />
    </linearGradient>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Deep Void Midnight -->
  <rect width="1200" height="675" fill="url(#obsidianBg)" />

  <!-- Subtle grid accent -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="220" fill="#2563EB" opacity="0.18" filter="blur(80px)" />
  <circle cx="1000" cy="500" r="240" fill="#0284C7" opacity="0.15" filter="blur(90px)" />

  <!-- Header: Logo Oficial + Nome -->
  <g transform="translate(80, 60)">
    <!-- Logo Icon -->
    <rect width="64" height="64" rx="18" fill="url(#logoGrad)" />
    <path d="M26 44 V20 M26 20 L18 28 M26 20 L34 28" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M38 20 V44 M38 44 L46 36 M38 44 L30 36" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Nome alinhado -->
    <text x="84" y="47" font-family="'Space Grotesk', 'Syne', sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="-1.5">
      escamb<tspan fill="#3B82F6">.io</tspan>
    </text>

    <!-- Tagline -->
    <text x="315" y="44" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#94A3B8">
      // Identidade Visual Oficial • Void Midnight &amp; Electric Cobalt Blue
    </text>
  </g>

  <!-- Section Title -->
  <text x="80" y="195" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="24" fill="#F8FAFC" letter-spacing="1.5">
    PALETA DE CORES OFICIAL (VOID MIDNIGHT &amp; ELECTRIC COBALT BLUE)
  </text>

  <!-- Color Swatches Container -->
  
  <!-- Swatch 1: Void Pitch Black (Fundo) -->
  <g transform="translate(80, 240)" filter="url(#cardGlow)">
    <rect width="190" height="320" rx="24" fill="#040509" stroke="#1E293B" stroke-width="1.5" />
    <rect x="20" y="20" width="150" height="130" rx="16" fill="#000000" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="24" y="200" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="19" fill="#FFFFFF">Void Pitch Black</text>
    <text x="24" y="228" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#64748B">Fundo Base / Imersão</text>
    <text x="24" y="260" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#94A3B8">#000000</text>
    <text x="24" y="285" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="12" fill="#475569">RGB(0, 0, 0)</text>
  </g>

  <!-- Swatch 2: Electric Cobalt Blue (Primária) -->
  <g transform="translate(292, 240)" filter="url(#cardGlow)">
    <rect width="190" height="320" rx="24" fill="#040509" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="20" y="20" width="150" height="130" rx="16" fill="url(#blueGrad)" />
    <text x="24" y="200" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="19" fill="#FFFFFF">Cobalt Blue</text>
    <text x="24" y="228" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#60A5FA">Primária / Contraste</text>
    <text x="24" y="260" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#3B82F6">#3B82F6</text>
    <text x="24" y="285" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="12" fill="#2563EB">RGB(59, 130, 246)</text>
  </g>

  <!-- Swatch 3: Electric Azure (Secundária) -->
  <g transform="translate(504, 240)" filter="url(#cardGlow)">
    <rect width="190" height="320" rx="24" fill="#040509" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="20" y="20" width="150" height="130" rx="16" fill="url(#azureGrad)" />
    <text x="24" y="200" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="19" fill="#FFFFFF">Electric Azure</text>
    <text x="24" y="228" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#38BDF8">Secundária / Tech Aura</text>
    <text x="24" y="260" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#38BDF8">#38BDF8</text>
    <text x="24" y="285" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="12" fill="#0284C7">#0284C7</text>
  </g>

  <!-- Swatch 4: Deep Indigo Glow -->
  <g transform="translate(716, 240)" filter="url(#cardGlow)">
    <rect width="190" height="320" rx="24" fill="#040509" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="20" y="20" width="150" height="130" rx="16" fill="url(#indigoGrad)" />
    <text x="24" y="200" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="19" fill="#FFFFFF">Deep Indigo</text>
    <text x="24" y="228" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#818CF8">Profundidade &amp; Tom</text>
    <text x="24" y="260" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#818CF8">#6366F1</text>
    <text x="24" y="285" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="12" fill="#4338CA">RGB(99, 102, 241)</text>
  </g>

  <!-- Swatch 5: Dark Surface Glass / Text -->
  <g transform="translate(928, 240)" filter="url(#cardGlow)">
    <rect width="190" height="320" rx="24" fill="#040509" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="20" width="150" height="130" rx="16" fill="url(#surfaceGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="24" y="200" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="19" fill="#FFFFFF">Dark Glass Card</text>
    <text x="24" y="228" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#94A3B8">Cards &amp; Tipografia</text>
    <text x="24" y="260" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#FFFFFF">#FFFFFF</text>
    <text x="24" y="285" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="12" fill="#64748B">Surface: #07080D</text>
  </g>
</svg>
